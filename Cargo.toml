[package]
name = "pqchain"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
axum = "0.8.9"
chacha20poly1305 = "0.10"
clap = { version = "4.6.10", features = ["derive"] }
fips205 = "0.5"
hex = "0.4.3"
libcrux-ml-dsa = "0.0.12"
libcrux-ml-kem = "0.0.12"
rand = "0.10"
reed-solomon-erasure = "6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12"
tokio = { version = "1.54.1", features = ["full"] }
ureq = "2"
wasmi = "1"
wat = "1.263.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
