[package]
name = "pqchain-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
wasm-smith = "0.263"
pqchain = { path = ".." }

[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot"
path = "fuzz_targets/snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "supply"
path = "fuzz_targets/supply.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wasm"
path = "fuzz_targets/wasm.rs"
test = false
doc = false
bench = false
